name: 배포본 만들기 (Releases)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "올릴 태그 (예: v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 시험 통과 확인
        run: |
          python -m pip install numpy shapely pillow
          python tests/ci_run.py --out ci_out --no-render
      - name: 묶음 만들기
        run: |
          mkdir -p dist/GH_AI_빌더
          cp src/GH_AI_builder.py src/사용법.txt dist/GH_AI_빌더/
          mkdir -p dist/GH_AI_빌더/examples && cp examples/*.json dist/GH_AI_빌더/examples/
          cp src/GH_AI_builder.py dist/
          (cd dist && zip -qr GH_AI_builder_with_examples.zip GH_AI_빌더)
      - name: Release 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<NOTES
          **설치 없이 쓰기:** \`GH_AI_builder.py\`를 받아 Rhino 8 명령창에서 \`RunPythonScript\`로 실행하세요.
          예제 JSON과 사용법이 필요하면 \`GH_AI_builder_with_examples.zip\`을 받으세요.

          웹 미리보기: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NOTES
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" dist/GH_AI_builder.py dist/GH_AI_builder_with_examples.zip --clobber \
            || gh release create "$TAG" dist/GH_AI_builder.py dist/GH_AI_builder_with_examples.zip --title "GH AI 빌더 $TAG" --notes-file notes.md
