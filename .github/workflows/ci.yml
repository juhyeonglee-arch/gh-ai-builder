name: 자동 시험

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # PR 시험 그림을 ci-results 브랜치에 올리기 위해
  pull-requests: write   # PR에 결과 댓글

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: 시험 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 설치
        run: python -m pip install numpy shapely pillow

      - name: 빌더 파일 문법 확인
        run: python -m py_compile src/GH_AI_builder.py

      - name: 예제 시험 (이름·재현·검사기·간섭·간이 그림)
        run: python tests/ci_run.py --out ci_out

      - name: 08 타워 3D 렌더 (Linux)
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          npm install --no-save --no-package-lock three@0.170.0 playwright@1.49.1
          npx playwright install --with-deps chromium
          export THREE_JS="$PWD/node_modules/three/build/three.module.js"
          cd ci_out
          python ../tests/tools/views.py ../examples/08_비틀린다이아그리드타워_v3.json 08_렌더
          rm -rf 08_렌더_data
          ls -la

      - name: 웹 미리보기 확인 (Linux)
        if: runner.os == 'Linux' && always()
        shell: bash
        env:
          EXPECT: '{"08": 80081}'
        run: |
          python web/build_site.py _site
          node web/smoke_test.js _site ci_out

      - name: 결과 요약
        if: always()
        shell: bash
        run: |
          for f in ci_out/summary.md ci_out/web_summary.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true

      - name: PR에 결과와 그림 남기기 (Linux)
        if: runner.os == 'Linux' && always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          dir="pr-$PR/${{ github.run_id }}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code "$url" ci-results >/dev/null; then git clone -q --depth 1 --branch ci-results "$url" cr
          else mkdir cr && git -C cr init -q -b ci-results && git -C cr remote add origin "$url"; fi
          mkdir -p "cr/$dir" && cp ci_out/*.png "cr/$dir/" 2>/dev/null || true
          git -C cr -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -C cr -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "PR #$PR 시험 그림 ($dir)" || true
          git -C cr push -q origin ci-results
          python tests/pr_report.py ci_out "https://raw.githubusercontent.com/$REPO/ci-results/$dir" > body.md
          gh pr comment "$PR" -R "$REPO" --body-file body.md --edit-last --create-if-none || gh pr comment "$PR" -R "$REPO" --body-file body.md

      - name: 시험 그림 올리기
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: 시험그림-${{ matrix.os }}
          path: ci_out/
          if-no-files-found: warn
          retention-days: 30

  secrets-scan:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: API 키·개인 파일이 들어가지 않았는지 확인
        shell: bash
        run: |
          set -e
          if grep -rIEn 'sk-ant-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' --exclude-dir=.git .; then
            echo "::error::API 키처럼 보이는 문자열이 있어요. 지우고 키를 새로 발급하세요."; exit 1; fi
          bad=$(git ls-files | grep -iE '\.(3dm|3dmbak|gh|ghx|dwg|dxf|shp)$|(^|/)api_key\.txt$|(^|/)\.env$' || true)
          if [ -n "$bad" ]; then echo "::error::올리면 안 되는 파일: $bad"; exit 1; fi
          echo "문제 없음"
