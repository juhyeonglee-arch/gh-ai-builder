<!doctype html><html><body style="margin:0;background:#f4f4f2"><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const P = window.__params;
const info = await (await fetch('/data/info.json')).json();
const W=P.w,H=P.h; const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setClearColor(0xf4f4f2);
const sc=new THREE.Scene();
sc.add(new THREE.HemisphereLight(0xffffff,0x8a8070,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(0.5,-0.8,0.9); sc.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.5); dl2.position.set(-0.7,0.6,0.3); sc.add(dl2);
const M={steel:{color:0x3d4148,metalness:0.35,roughness:0.55},concrete:{color:0xcfccc4,roughness:0.95},
 glass:{color:0x7fa7c4,transparent:true,opacity:P.glassOpacity??0.45,roughness:0.1,metalness:0.2,depthWrite:false},
 aluminum:{color:0xb9bcc0,metalness:0.5,roughness:0.4},spandrel:{color:0x2f343b,roughness:0.6},none:{color:0x999999}};
for (const k of Object.keys(info)){ if(k[0]=='_') continue; if((P.hide||[]).includes(k)) continue;
  const buf=await (await fetch('/data/'+k+'.bin')).arrayBuffer();
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(buf),3)); g.computeVertexNormals();
  const m=new THREE.MeshStandardMaterial({...(M[k]||M.none),side:THREE.DoubleSide,flatShading:true});
  const mesh=new THREE.Mesh(g,m); if(k=='glass') mesh.renderOrder=2; sc.add(mesh);}
const cam=new THREE.PerspectiveCamera(P.fov,W/H,P.near||100,P.far||2e6); cam.up.set(0,0,1);
cam.position.set(...P.eye); cam.lookAt(...P.target);
r.render(sc,cam); window.__done=true;
</script></body></html>
